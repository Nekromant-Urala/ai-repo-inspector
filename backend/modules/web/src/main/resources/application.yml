server:
  port: 8080

spring:
  application:
    name: ai-repo-inspector
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/airepo}
    username: ${DB_USER:airepo}
    password: ${DB_PASSWORD:airepo}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    root: INFO
    com.airepo: DEBUG

airepo:
  tests:
    # Критерий «Покрытие тестами»: статический анализ + изолированный запуск тестов.
    # AUTO — Docker, если доступен; STATIC_ONLY — без запуска тестов.
    enabled: ${AIREPO_TESTS_ENABLED:true}
    mode: ${AIREPO_TESTS_MODE:AUTO}
    allow-local-execution: ${AIREPO_TESTS_ALLOW_LOCAL:false}
    timeout: ${AIREPO_TESTS_TIMEOUT:10m}
    target-coverage: ${AIREPO_TESTS_TARGET_COVERAGE:80}
    warning-coverage: ${AIREPO_TESTS_WARNING_COVERAGE:50}
    sandbox:
      # none — полностью герметичный прогон (зависимости должны быть в образе/проекте).
      network: ${AIREPO_TESTS_NETWORK:bridge}
      memory: ${AIREPO_TESTS_MEMORY:2g}
      cpus: ${AIREPO_TESTS_CPUS:2.0}
      tmpfs-size: ${AIREPO_TESTS_TMPFS_SIZE:2g}
      pids-limit: ${AIREPO_TESTS_PIDS_LIMIT:512}
